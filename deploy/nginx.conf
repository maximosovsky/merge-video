server {
    listen 80;
    server_name merge-video.osovsky.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name merge-video.osovsky.com;

    ssl_certificate /etc/letsencrypt/live/merge-video.osovsky.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/merge-video.osovsky.com/privkey.pem;

    client_max_body_size 5G;

    # Rate limiting zone (defined in nginx.conf http block)
    # Add to /etc/nginx/nginx.conf http{} block:
    #   limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # API + site
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for future use)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeout for long merge operations
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Rate limit merge endpoint
    location /merge {
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
