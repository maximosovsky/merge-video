server {
    listen 80;
    server_name merge.osovsky.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name merge.osovsky.com;

    ssl_certificate /etc/letsencrypt/live/merge.osovsky.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/merge.osovsky.com/privkey.pem;

    client_max_body_size 5G;

    # API + site
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for future use)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeout for long merge operations
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
